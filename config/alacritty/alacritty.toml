[window]
opacity = 0.8

[font]
size = 13.0

[font.normal]
family = "DejaVu Sans Mono"

[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Block"

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true  # closest approximation

[bell]
animation = "Ease"
duration = 0

[colors.primary]
background = "#24283b"
foreground = "#c0caf5"

[colors.cursor]
text = "#24283b"
cursor = "#c0caf5"

[colors.selection]
text = "#c0caf5"
background = "#2e3c64"

[colors.normal]
black   = "#1d202f"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#ff899d"
green   = "#9fe044"
yellow  = "#faba4a"
blue    = "#8db0ff"
magenta = "#c7a9ff"
cyan    = "#a4daff"
white   = "#c0caf5"

# Extended colors (not directly supported, but kept for reference)
# color16 = "#ff9e64"
# color17 = "#db4b4b"

[colors.search.matches]
foreground = "#24283b"
background = "#e0af68"

[colors.search.focused_match]
foreground = "#24283b"
background = "#ff9e64"

[colors.hints.start]
foreground = "#24283b"
background = "#e0af68"

[colors.hints.end]
foreground = "#24283b"
background = "#7aa2f7"

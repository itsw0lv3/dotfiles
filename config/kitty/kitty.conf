background_opacity 0.5
background_blur 1
confirm_os_window_close 0
copy_on_select yes
cursor_shape block
cursor_shape_unfocused hollow
font_family Dejavu Mono
font_size 12
mouse_hide_wait 1.5
shell_integration no-cursor

enable_audio_bell no
paste_actions filter

# BEGIN_KITTY_THEME
# Tokyo Night Storm
include current-theme.conf
# END_KITTY_THEME
